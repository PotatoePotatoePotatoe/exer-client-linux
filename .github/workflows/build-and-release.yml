name: Build and Release Linux Packages

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Install system packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg curl libfuse2 tar

      - name: Package AppImage, DEB and TAR.GZ
        run: |
          chmod +x scripts/*.sh
          ./scripts/package_all.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exer-client-linux-packages
          path: dist-packages/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-packages/*.AppImage
            dist-packages/*.deb
            dist-packages/*.tar.gz
            dist-packages/SHA256SUMS.txt
          generate_release_notes: true
